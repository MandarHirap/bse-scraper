<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BSE Top Gainers</title>
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#14231c;--mute:#64756b;--up:#0a7d3e;--line:#dbe5df}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#16211b;--ink:#e6efe9;--mute:#8aa095;--up:#3ddc84;--line:#25352c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:16px}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
#meta{color:var(--mute);font-size:13px}
#err{color:#b3261e;margin:0 0 12px;font-size:14px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{font-weight:600;color:var(--mute);font-size:13px;position:sticky;top:0;background:var(--card)}
td.pct{color:var(--up);font-weight:600}
tbody tr:last-child td{border-bottom:0}
:focus-visible{outline:2px solid var(--up);outline-offset:2px}
</style></head><body><main>
<header><h1>BSE Top Gainers</h1><span id="meta">Loading first scrape, this takes ~20 seconds.</span></header>
<p id="err" role="alert" hidden></p>
<div class="wrap"><table>
<thead><tr><th>Code</th><th>Company</th><th>LTP (₹)</th><th>Change</th></tr></thead>
<tbody id="rows"></tbody></table></div>
</main>
<script>
const f=n=>n==null?"–":n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
async function load(){
  try{
    const d=await (await fetch("/api/gainers")).json();
    const err=document.getElementById("err");
    err.hidden=!d.error; err.textContent=d.error||"";
    if(d.updated) document.getElementById("meta").textContent=`${d.rows.length} companies · updated ${d.updated}`;
    if(d.rows.length) document.getElementById("rows").innerHTML=d.rows.map(r=>
      `<tr><td>${r.code}</td><td>${r.name.replace(/</g,"&lt;")}</td><td>${f(r.ltp)}</td><td class="pct">${r.pct==null?"–":"+"+f(r.pct)+"%"}</td></tr>`).join("");
  }catch(e){}
}
load(); setInterval(load,{{ refresh }}*500);
</script></body></html>
